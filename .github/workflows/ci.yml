name: research-harness-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Infrastructure and methodology tests
        run: python -m unittest discover -s tests -v
      - name: Dataset-agnostic project scaffolding and audit smoke test
        run: |
          LAB=$(mktemp -d)
          python -m research_lab.study --root "$LAB" init arbitrary-study --title "Can we reproduce this synthetic question?"
          python -m research_lab.study --root "$LAB" run arbitrary-study
          python -m research_lab.study --root "$LAB" audit arbitrary-study --replay
      - name: Validate evidence-matrix structure (not factual verification)
        run: |
          python -m research_lab.evidence \
            research/robust-location/evidence_matrix.csv \
            research/leadtime-dependence/evidence_matrix.csv \
            research/selection-transfer/evidence_matrix.csv
      - name: Verify legacy pilot registry and scientific stop gate
        run: |
          python -m research_lab.cli gate research/robust-location/proposal.json
          python -m research_lab.cli audit
      - name: Exploratory AR1 experiment
        run: python -m research_lab.leadtime --config research/leadtime-dependence/exploratory.json --output research-output/exploratory
      - name: Verify exploratory artifacts by deterministic replay
        run: python -m research_lab.leadtime --verify --config research/leadtime-dependence/exploratory.json --output research-output/exploratory
      - name: Frozen confirmatory AR1 experiment
        run: python -m research_lab.leadtime --config research/leadtime-dependence/confirmatory.json --output research-output/confirmatory
      - name: Verify confirmatory artifacts by deterministic replay
        run: python -m research_lab.leadtime --verify --config research/leadtime-dependence/confirmatory.json --output research-output/confirmatory
      - name: Upload experimental evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadtime-protocol-results
          path: research-output/
          if-no-files-found: warn
